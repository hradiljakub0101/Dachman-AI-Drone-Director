name: DachmanDroneDirector
options:
  bundleIdPrefix: cz.dachman
  deploymentTarget:
    iOS: "16.0"
packages:
  DachmanFlightCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  DachmanDroneDirector:
    type: application
    platform: iOS
    sources:
      - path: DachmanDroneDirector
    info:
      path: DachmanDroneDirector/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.dachman.drone.director
        PRODUCT_NAME: Dachman Drone Director
        SWIFT_OBJC_BRIDGING_HEADER: DachmanDroneDirector/DJI/DachmanDroneDirector-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Inject DJI key into processed plist
        showEnvVars: false
        script: python3 "$SRCROOT/../scripts/inject_dji_key.py"
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: DachmanFlightCore
