name: Android APK and approval tests
on:
  workflow_dispatch:
    inputs:
      use_dji_key:
        description: 'Build DJI debug APK using saved DJI_ANDROID_APP_KEY (embedded in APK)'
        type: boolean
        default: false
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu image already contains the Android SDK. The legacy
      # setup-android action now asks sdkmanager for the removed `tools`
      # package and fails before Gradle can start.
      - name: Verify Android SDK on runner
        shell: bash
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          test -d "$android_sdk"
          echo "Android SDK available at $android_sdk"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify DJI RC-N1 USB integration
        run: python3 scripts/verify_android_usb_integration.py
      - name: Verify Android launcher icon resources
        run: python3 scripts/verify_android_launcher_icon.py
      - name: Test and build demo and DJI debug APKs
        working-directory: androidApp
        env:
          # Pull-request builds stay keyless; the protected main branch may
          # produce the installable DJI build automatically after merge.
          DJI_ANDROID_APP_KEY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.use_dji_key) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.DJI_ANDROID_APP_KEY || '' }}
        run: gradle testDemoDebugUnitTest assembleDemoDebug assembleDjiDebug
      - name: Verify configured DJI key in APK and APK signature
        if: (github.event_name == 'workflow_dispatch' && inputs.use_dji_key) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DJI_ANDROID_APP_KEY: ${{ secrets.DJI_ANDROID_APP_KEY }}
        run: python3 scripts/verify_android_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: androidApp/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
