name: iOS core and DJI compatibility
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  dji-device-build-spike:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen cocoapods
      - run: xcodegen generate
        working-directory: iOSApp
      - run: pod install --repo-update
        working-directory: iOSApp
      - name: Unsigned device compatibility build (not a distributable IPA)
        working-directory: iOSApp
        run: >-
          xcodebuild -workspace DachmanDroneDirector.xcworkspace
          -scheme DachmanDroneDirector -configuration Debug -sdk iphoneos
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
