name: Android APK and approval tests
on:
  workflow_dispatch:
    inputs:
      use_dji_key:
        description: 'Build DJI debug APK using saved DJI_ANDROID_APP_KEY (embedded in APK)'
        type: boolean
        default: false
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu image already contains the Android SDK. The legacy
      # setup-android action now asks sdkmanager for the removed `tools`
      # package and fails before Gradle can start.
      - name: Verify Android SDK on runner
        shell: bash
        run: |
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          test -d "$android_sdk"
          echo "Android SDK available at $android_sdk"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify DJI RC-N1 USB integration
        run: python3 scripts/verify_android_usb_integration.py
      - name: Verify Android launcher icon resources
        run: python3 scripts/verify_android_launcher_icon.py
      - name: Verify camera recording integration
        run: python3 scripts/verify_android_recording_integration.py
      - name: Test and build demo and DJI debug APKs
        working-directory: androidApp
        env:
          # Pull-request builds stay keyless; the protected main branch may
          # produce the installable DJI build automatically after merge.
          DJI_ANDROID_APP_KEY: ${{ ((github.event_name == 'workflow_dispatch' && inputs.use_dji_key) || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.DJI_ANDROID_APP_KEY || '' }}
        run: gradle testDemoDebugUnitTest assembleDemoDebug assembleDjiDebug
      - name: Verify configured DJI key in APK and APK signature
        if: (github.event_name == 'workflow_dispatch' && inputs.use_dji_key) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          DJI_ANDROID_APP_KEY: ${{ secrets.DJI_ANDROID_APP_KEY }}
        run: python3 scripts/verify_android_apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: androidApp/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

  publish:
    name: publish versioned Android downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apks
          path: downloaded-apks
      - name: Prepare named APKs and ZIP
        shell: bash
        run: |
          release_version="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" androidApp/app/build.gradle | head -n 1)"
          test -n "$release_version"
          test -f downloaded-apks/dji/debug/app-dji-debug.apk
          test -f downloaded-apks/demo/debug/app-demo-debug.apk
          mkdir -p release
          cp downloaded-apks/dji/debug/app-dji-debug.apk "release/Dachman-AI-Drone-Director-v${release_version}-DJI.apk"
          cp downloaded-apks/demo/debug/app-demo-debug.apk "release/Dachman-AI-Drone-Director-v${release_version}-Demo.apk"
          (
            cd release
            zip -9 "Dachman-AI-Drone-Director-v${release_version}-Android.zip" "Dachman-AI-Drone-Director-v${release_version}-DJI.apk" "Dachman-AI-Drone-Director-v${release_version}-Demo.apk"
          )
          echo "release_version=${release_version}" >> "$GITHUB_ENV"
          echo "release_tag=android-v${release_version}" >> "$GITHUB_ENV"
      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --target "$GITHUB_SHA" --title "Dachman AI Drone Director Android v${release_version}" --notes "Android DJI and demo builds verified by GitHub Actions, including Flat Camera Mode recording, aircraft microSD preflight, launcher resources, USB/AOA integration, configured DJI key and APK signature."
          else
            gh release create "$release_tag" --target "$GITHUB_SHA" --title "Dachman AI Drone Director Android v${release_version}" --notes "Android DJI and demo builds verified by GitHub Actions, including Flat Camera Mode recording, aircraft microSD preflight, launcher resources, USB/AOA integration, configured DJI key and APK signature."
          fi
          gh release upload "$release_tag" release/*.apk release/*.zip --clobber
